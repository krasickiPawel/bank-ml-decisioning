services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile

    user: "${PUID:-1000}:${PGID:-1000}"

    container_name: mlflow
    working_dir: /mlflow
    ports:
      - "5050:5000"
    volumes:
      - ./mlflow:/mlflow
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
